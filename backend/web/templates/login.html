<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SojaFit 로그인</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f7fa; color: #182230; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 42rem; margin: 4rem auto; padding: 2rem; background: white; border: 1px solid #d8dee8; border-radius: 1rem; }
    h1 { margin-top: 0; }
    label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #98a2b3; border-radius: .4rem; font: inherit; }
    textarea { min-height: 7rem; resize: vertical; }
    button { margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: .4rem; background: #1459a6; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #84caff; outline-offset: 2px; }
    [hidden] { display: none !important; }
    #answer { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #f5f7fa; border-radius: .4rem; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>SojaFit</h1>
    <section id="login-view" aria-labelledby="login-title">
      <h2 id="login-title">로그인</h2>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required maxlength="100">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="1024">
        <button type="submit">로그인</button>
      </form>
    </section>
    <section id="question-view" aria-labelledby="question-title" hidden>
      <h2 id="question-title">데이터시트에 질문하기</h2>
      <form id="question-form">
        <label for="question">질문</label>
        <textarea id="question" required maxlength="2000"></textarea>
        <button type="submit">답변 받기</button>
      </form>
      <h3>답변</h3>
      <p id="answer" aria-live="polite"></p>
      <button id="logout" type="button">로그아웃</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const loginView = document.querySelector("#login-view");
    const questionView = document.querySelector("#question-view");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");

    function showQuestionView() {
      loginView.hidden = true;
      questionView.hidden = false;
      status.textContent = "로그인되었습니다. 민감정보나 비밀값이 포함된 질문은 입력하지 마세요.";
    }

    async function currentSession() {
      try {
        const response = await fetch("/api/auth/me", { credentials: "same-origin" });
        if (response.ok) showQuestionView();
      } catch {
        status.textContent = "로그인 후 질문할 수 있습니다.";
      }
    }

    document.querySelector("#login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "로그인 확인 중입니다.";
      const response = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.querySelector("#email").value, password: document.querySelector("#password").value })
      }).catch(() => null);
      if (!response || !response.ok) {
        document.querySelector("#password").value = "";
        status.textContent = "로그인할 수 없습니다. 이메일과 비밀번호를 확인해 주세요.";
        return;
      }
      document.querySelector("#password").value = "";
      showQuestionView();
    });

    document.querySelector("#question-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "답변을 만드는 중입니다.";
      answer.textContent = "";
      const response = await fetch("/api/ask", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: document.querySelector("#question").value })
      }).catch(() => null);
      if (!response || !response.ok) {
        status.textContent = response?.status === 401 ? "세션이 만료되었습니다. 다시 로그인해 주세요." : "질문을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";
        if (response?.status === 401) {
          document.querySelector("#question").value = "";
          answer.textContent = "";
          questionView.hidden = true;
          loginView.hidden = false;
        }
        return;
      }
      const result = await response.json();
      answer.textContent = result.answer;
      status.textContent = "답변을 표시했습니다. 질문과 답변은 저장하지 않습니다.";
    });

    document.querySelector("#logout").addEventListener("click", async () => {
      const response = await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }).catch(() => null);
      if (!response || !response.ok) {
        status.textContent = "로그아웃을 확인할 수 없습니다. 다시 시도해 주세요.";
        return;
      }
      document.querySelector("#email").value = "";
      document.querySelector("#password").value = "";
      document.querySelector("#question").value = "";
      answer.textContent = "";
      questionView.hidden = true;
      loginView.hidden = false;
      status.textContent = "로그아웃했습니다.";
    });

    currentSession();
  </script>
</body>
</html>
