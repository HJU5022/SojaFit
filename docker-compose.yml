# G2: `docker compose up` 한 줄로 전체 서비스가 10분 안에 떠야 합니다.
# 평가자에게는 API 키가 없으므로 기본값은 데모 모드(DEMO_MODE=1)입니다.
# 필요 없는 서비스는 지우고, 필요한 것(redis 등)은 추가하세요.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    # .env가 없어도 뜹니다 (키가 필요 없는 데모 모드)
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      DEMO_SCENARIOS: ${DEMO_SCENARIOS:-${DEMO_MODE:-1}}
      THREADS_ENABLED: "1"
      AUTH_ORIGIN: ${DEMO_AUTH_ORIGIN:-http://localhost:8000}
      # 호스트 이름 db는 아래 db 서비스. .env의 DATABASE_URL보다 이 값이 우선한다.
      DATABASE_URL: postgresql://app:app@db:5432/app
    # db가 healthcheck를 통과한 뒤에 api를 띄운다(스키마 적재 전에 연결하지 않게).
    depends_on:
      db:
        condition: service_healthy
      thread-setup:
        condition: service_completed_successfully
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64

  thread-setup:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    command: ["python", "-m", "backend.conversations.memory_service", "--setup"]
    depends_on:
      db:
        condition: service_healthy

  db:
    # pgvector 확장이 들어 있는 Postgres. 스냅샷 적재는 db/ 아래에 SQL로 추가하세요.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      # 아래 DEMO_* 값은 db/007_demo_accounts.sql이 빈 DB 첫 기동 때 데모 계정을 만드는 데 쓴다. 비어 있으면 계정을 만들지 않는다.
      DEMO_MODE: ${DEMO_MODE:-1}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD_HASH: ${DEMO_ADMIN_PASSWORD_HASH:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD_HASH: ${DEMO_USER_PASSWORD_HASH:-}
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지. 초기화하려면 docker compose down -v
      # initdb 폴더의 .sql은 데이터 폴더가 비어 있을 때 첫 기동에만 파일 이름순으로 실행된다.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
