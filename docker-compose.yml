# G2: `docker compose up` 한 줄로 전체 서비스가 10분 안에 떠야 합니다.
# 평가자에게는 API 키가 없으므로 기본값은 데모 모드(DEMO_MODE=1)입니다.
# 기본 서비스 4개: api(FastAPI + 빌드한 React 화면), thread-setup(분석 저장소 준비 후 종료), corpus-load(데모 코퍼스 스냅샷 적재 후 종료), db(pgvector PostgreSQL).
services:
  api:
    build:
      context: .
      args:
        INCLUDE_KICAD: "0"
    ports:
      - "8000:8000"
    # .env가 없어도 뜹니다 (키가 필요 없는 데모 모드)
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: ${DEMO_MODE:-1}
      # 키 없는 데모의 분석은 LLM 응답 기록(data/demo/recordings/)을 재생한다. 기본은 DEMO_MODE를 따른다(.env.example 참고).
      DEMO_REPLAY: ${DEMO_REPLAY:-${DEMO_MODE:-1}}
      THREADS_ENABLED: "1"
      # .env의 AUTH_ORIGIN(배포 주소일 수 있음) 대신 compose 전용 DEMO_AUTH_ORIGIN을 쓴다(.env.example 참고).
      AUTH_ORIGIN: ${DEMO_AUTH_ORIGIN:-http://localhost:8000}
      # 호스트 이름 db는 아래 db 서비스. .env의 DATABASE_URL보다 이 값이 우선한다.
      DATABASE_URL: postgresql://app:app@db:5432/app
      KICAD_RENDERER_URL: ${KICAD_RENDERER_URL:-http://renderer:8000}
    # db가 healthcheck를 통과한 뒤에 api를 띄운다(스키마 적재 전에 연결하지 않게).
    depends_on:
      db:
        condition: service_healthy
      thread-setup:
        condition: service_completed_successfully
      corpus-load:
        condition: service_completed_successfully
    # Apple Silicon에서 이미지가 안 뜨면 아래 주석을 해제해 보세요
    # platform: linux/amd64

  thread-setup:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    command: ["python", "-m", "backend.conversations.memory_service", "--setup"]
    depends_on:
      db:
        condition: service_healthy

  # 데모 코퍼스 스냅샷(data/demo/snapshot/, 임베딩 없음)을 문서·청크 표에 넣는다. 이미 있는 문서·청크는 건너뛰어 다시 떠도 늘지 않는다.
  # DEMO_MODE와 상관없이 늘 돈다. DEMO_MODE=0으로 띄워도 같은 DB에 이 데모 스냅샷이 들어간다.
  corpus-load:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      # db/008이 임베딩 열을 차원 없는 halfvec으로 바꿨다. ingest.py가 열 형식을 이 값과 대조한다.
      RAG_VECTOR_TYPE: halfvec
    # 세 번째 인자(벡터 캐시 폴더)는 --chunks-only에서 쓰지 않지만 ingest.py가 받는다.
    command: ["python", "-m", "backend.rag.pipeline.ingest", "data/demo/snapshot/manifest.jsonl",
              "data/demo/snapshot/chunks.jsonl", "/tmp/vectors", "--chunks-only"]
    depends_on:
      db:
        condition: service_healthy

  # KiCad 10 원본 변환만 담당하는 선택적 무상태 서비스. 기본 up에는 포함되지 않는다.
  # 로컬에서 renderer까지 띄우려면 `docker compose --profile schematic up --build`를 사용한다.
  # KICAD_RENDERER_URL을 지정하지 않은 Compose API는 이 서비스의 내부 주소를 사용한다.
  renderer:
    profiles: ["schematic"]
    build:
      context: .
      target: renderer
  db:
    # pgvector 확장이 들어 있는 Postgres. 서비스 표는 db/020_service_baseline.sql(기준선)이 만들고 LangGraph 표는 thread-setup이 만들고, 데모 코퍼스 스냅샷은 위 corpus-load가 넣는다.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지. 초기화하려면 docker compose down -v
      # initdb 폴더의 .sql은 데이터 폴더가 비어 있을 때 첫 기동에만 파일 이름순으로 실행된다.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # [왜] 새 볼륨의 첫 기동에서 initdb 임시 서버는 Unix 소켓만 연다. 소켓으로 묻는 검사는 db/*.sql이 도는 중에도 통과해 thread-setup · corpus-load가 TCP가 열리기 전에 접속하다 exit 1로 죽는다(재시도 없음).
      #      -h 127.0.0.1로 TCP를 물어 진짜 서버가 뜬 뒤에만 healthy가 되게 한다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
