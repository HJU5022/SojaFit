# gitleaks 설정. 기본 규칙을 그대로 쓰고 아래 경로만 검사에서 뺀다(.github/workflows/secret-scan.yml이 저장소 루트에서 읽음).
# [주의] [extend] useDefault를 지우면 기본 규칙이 모두 꺼져 아무것도 검사하지 않는다.
[extend]
useDefault = true

# [왜] 리랭크 캐시의 "key"는 sha256(모델 · 질문 · 후보) 해시(evals/runners/run_embedding_grid.py 60줄)라 API 키가 아닌데,
#      generic-api-key 규칙에 986건 걸려 main과 모든 PR의 검사가 실패했다(11-06, PR #66에서 확인).
# [왜] 검사가 히스토리 전체를 보므로 파일을 고쳐도 옛 커밋에서 다시 걸린다. 그래서 이 파일 경로 하나만 뺀다.
[[allowlists]]
description = "리랭크 캐시의 sha256 해시 key(비밀값 아님)"
paths = ['''evals/results/embedding/grid_rerank_cache_2026-11-02\.jsonl''']
