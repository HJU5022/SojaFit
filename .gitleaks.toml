# gitleaks 설정. 기본 규칙을 그대로 쓰고 아래 경로만 검사에서 뺀다(.github/workflows/secret-scan.yml이 저장소 루트에서 읽음).
# [주의] [extend] useDefault를 지우면 기본 규칙이 모두 꺼져 아무것도 검사하지 않는다.
[extend]
useDefault = true

# [왜] 리랭크 캐시의 "key"는 sha256(모델 · 질문 · 후보) 해시(evals/runners/run_embedding_grid.py 60줄)라 API 키가 아닌데,
#      generic-api-key 규칙에 986건 걸려 main과 모든 PR의 검사가 실패했다(11-06, PR #66에서 확인).
# [왜] 검사가 히스토리 전체를 보므로 파일을 고쳐도 옛 커밋에서 다시 걸린다. 그래서 이 파일 경로 하나만 뺀다.
[[allowlists]]
description = "리랭크 캐시의 sha256 해시 key(비밀값 아님)"
paths = ['''evals/results/embedding/grid_rerank_cache_2026-11-02\.jsonl''']

# [왜] 인증 · 오류 · 탈퇴 시험의 가짜 비밀번호(synthetic- · test- · another-)와 격리 시험용 가짜 AUTH_SECRET(isolated-)이
#      generic-api-key에 20건 걸렸다(11-10 로컬 검사). tests/ 아래에서 이 접두어로 시작하는 값만 뺀다.
[[allowlists]]
description = "시험용 가짜 비밀번호 · 비밀값(tests/ 안, 정해진 접두어만)"
condition = "AND"
paths = ['''^tests/''']
regexes = ['''^(synthetic|test|another|isolated)-''']

# [왜] 기억 준비 명령이 적용하는 SQL 파일 이름 목록('022_token_limits.sql', '023_retention.sql')을 키로 오인했다.
[[allowlists]]
description = "SQL 마이그레이션 파일 이름(비밀값 아님)"
condition = "AND"
paths = ['''^backend/conversations/memory_service\.py$''']
regexes = ['''^\d{3}_[a-z_]+\.sql$''']

# [왜] 11-11 PR #85 병합 뒤 로컬 검사에서 generic-api-key 64건이 나왔고 모두 키가 아니었다(실제 키 형식 직접 검색은 0건).
#      인젝션 측정 원시 결과의 document_key는 코퍼스 문서 식별 값이다(이력 검사 기준 2개 파일 360건: ..._03.jsonl 240, ..._03_human_jeongun.jsonl 120, 2026-11-13 `b5f050d`).
[[allowlists]]
description = "인젝션 측정 원시 결과의 document_key(코퍼스 문서 식별 값, 비밀값 아님)"
targetRules = ["generic-api-key"]
paths = ['''evals/results/threads/injection_baseline_live_.*\.jsonl''']

# [왜] 작업 기록의 되돌리기 명령 `--to-revisions=sojafit-api-716c6d6=100`의 배포 리비전 이름이 키로 오인됐다(4건).
[[allowlists]]
description = "작업 기록의 되돌리기 명령 --to-revisions=<리비전 이름>(비밀값 아님)"
targetRules = ["generic-api-key"]
paths = ['''^docs/worklog/.*\.md$''']
regexes = ['''--to-revisions=''']
