# PR마다 테스트를 돌립니다. 인증 DB는 CI 전용으로 격리합니다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 인증 통합 테스트(tests/api/test_auth.py)용 격리 PostgreSQL. 운영·개발 DB와 무관한 일회용 컨테이너다.
    services:
      auth-db:
        image: postgres:16
        env:
          POSTGRES_USER: ci_auth
          POSTGRES_PASSWORD: ci_auth_only
          POSTGRES_DB: ci_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_auth -d ci_auth"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # 이 변수가 없으면 인증 DB 테스트는 건너뛴다. 포트 5432는 위 services의 연결이다(scripts/의 실측 스크립트는 로컬 55434 전용).
      TEST_AUTH_DATABASE_URL: postgresql://ci_auth:ci_auth_only@127.0.0.1:5432/ci_auth
      TEST_THREAD_DATABASE_URL: postgresql://ci_auth:ci_auth_only@127.0.0.1:5432/ci_auth
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.9"
      # --locked: uv.lock이 pyproject.toml과 어긋나면 실패해 잠금 파일 누락을 PR에서 잡는다.
      - run: uv sync --locked
      # 서비스 표(인증 · 프로젝트 · 대화 · 승인 · 견적 · 분석 서비스)를 새 기준선(db/020_service_baseline.sql)으로 만든다. 파일 이름은 tests/db_schema.py 한 곳에만 있다.
      # LangGraph 표는 시험이 memory_service.initialize로 만든다.
      - name: Initialize service test database
        run: uv run python -c "import os, psycopg; from tests.db_schema import apply_service_schema; c=psycopg.connect(os.environ['TEST_AUTH_DATABASE_URL']); apply_service_schema(c, agent=True); c.commit(); c.close()"
      - run: uv run pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # 프런트 단위 테스트와 빌드.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # [왜] Dockerfile 빌드 단계(node:24-slim)와 같은 버전. 잠금 파일의 vitest 5·jsdom 31이 Node 22.12 이상을 요구해 20은 안 된다.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
  # 평가 회귀(키 없음): 기록한 LLM 응답으로 데모 질문 5개(v3 문항 3개 포함)를 서비스와 같은 멀티 그래프로 끝까지 돌리고,
  # 경로 · 판정 · 거절 · DB 지문이 기록(data/demo/recordings/outcomes.json)과 다르면 실패한다(scripts/demo/record_demo.py replay).
  # [왜] CI에는 API 키를 두지 않는다. 진짜 모델 점수는 eval-live.yml을 버튼으로 돌린다.
  eval-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # [왜] -p로 새 프로젝트(빈 볼륨)를 써야 corpus-load가 스냅샷을 넣어 청크 id(DB 지문)가 기록 때와 같다
      - name: Replay recorded demo questions without keys
        run: |
          docker compose -p sojafit-ci run --rm -e DEMO_MODE=1 -e OPENROUTER_API_KEY= -e VOYAGE_API_KEY= \
            -v "${PWD}/scripts:/app/scripts:ro" -v "${PWD}/evals:/app/evals:ro" -v "${PWD}/data/demo:/app/data/demo:ro" \
            api python scripts/demo/record_demo.py replay
      - if: always()
        run: docker compose -p sojafit-ci down -v

  # 인젝션 평가 회귀(키 · 네트워크 · DB 없음): ① 저장한 실측03 결과(110작업)가 사전 등록 기준을 지키는지 확인하고
  # (evals/runners/check_injection_result.py, 기준 근거는 그 파일 머리말), ② 인젝션 베이스라인 실행기(가짜 모델 · 실제 그래프)와
  # 저장한 C2 · 정상군 응답 재생을 다시 돈다. 기준 미달이면 실패한다.
  # [왜] 진짜 모델 호출은 비용 · 비밀 때문에 여기 넣지 않는다. 인젝션 실측(--execute)은 승인 파일 · 전용 DB 14개가 필요해 이 저장소의 로컬 절차(evals/guides/preregister.md)로만 돌린다.
  eval-injection-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Check saved injection baseline against preregistered criteria
        run: uv run python -m evals.runners.check_injection_result
      - name: Replay injection baseline harness and saved defense responses
        run: uv run pytest -q -p no:cacheprovider tests/evals/test_check_injection_result.py tests/evals/test_injection_baseline.py tests/evals/test_injection_baseline_plan.py tests/evals/test_injection_preflight.py tests/evals/test_saved_defense_replay.py
