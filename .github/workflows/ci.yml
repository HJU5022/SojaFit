# PR마다 테스트를 돌립니다. 인증 DB는 CI 전용으로 격리합니다.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      auth-db:
        image: postgres:16
        env:
          POSTGRES_USER: ci_auth
          POSTGRES_PASSWORD: ci_auth_only
          POSTGRES_DB: ci_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_auth -d ci_auth"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_AUTH_DATABASE_URL: postgresql://ci_auth:ci_auth_only@127.0.0.1:5432/ci_auth
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - name: Initialize authentication test database
        run: uv run python -c "import os, psycopg; from pathlib import Path; c=psycopg.connect(os.environ['TEST_AUTH_DATABASE_URL']); [c.execute(Path(f'db/{name}').read_text(encoding='utf-8-sig')) for name in ('003_auth.sql','005_auth_attempt_window.sql','006_user_roles.sql')]; c.commit(); c.close()"
      - run: uv run pytest -q
