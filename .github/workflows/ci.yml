# PR마다 테스트를 돌립니다. 동결한 평가셋이 바뀌면 여기서 실패합니다.
# Actions 무료 한도가 있으니 무거운 평가 전체가 아니라 샘플만 돌리세요.
name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.9"
      - run: uv sync --locked
      - run: uv run pytest -q
