# 의존성은 uv로 관리합니다. 추가는 `uv add 패키지`(개발용은 `uv add --dev 패키지`), 설치는 `uv sync`입니다.
[project]
name = "proj3-b"
version = "0.1.0"
description = "AI Human 7기 3차 팀 프로젝트 2조"
requires-python = ">=3.12"   # Dockerfile의 베이스 이미지(python:3.12)와 맞춘다
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.60",                        # OpenRouter도 이 SDK로 부릅니다(base_url만 교체)
    "langfuse>=2.50",                      # G6
    "langgraph>=1.0",                      # G4
    "langgraph-checkpoint-postgres>=3.0",  # 체크포인트를 DB에 (G4)
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "rank-bm25>=0.2",                      # 하이브리드의 키워드 쪽 (형태소 분석은 조에서 선택)
    "langchain-openai>=1.0",
    "mcp>=1.28,<2",
    "httpx>=0.27",
    "authlib>=1.6,<2",
    "joserfc>=1.8,<2",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [   # 테스트 전용. `uv sync`는 기본으로 설치하고 Docker 이미지는 --no-dev로 뺀다
    "pytest>=8",
    "httpx>=0.27",
]
# 오프라인 파싱 도구(backend/rag/pipeline/parse.py, chunk.py). 서버 이미지와 CI는 이 그룹을 설치하지 않습니다.
# 실행: uv run --group ingest python -m backend.rag.pipeline.parse ...
ingest = [
    "docling>=2.145",
    "pdfplumber>=0.11.10",
]

[tool.uv]
# 배포할 라이브러리가 아니라 앱이므로 프로젝트 자체는 패키지로 설치하지 않습니다.
package = false
