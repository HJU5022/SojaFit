  <line x1="275" y1="712" x2="275" y2="746" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="70" y="750" width="410" height="130" rx="18" fill="#f1efe9" stroke="#8a8780"/>
  <text x="275" y="800" text-anchor="middle" font-size="30" font-weight="700" fill="#222">대체 부품 판정</text>
  <text x="275" y="843" text-anchor="middle" font-size="23" fill="#555">코드 · 사양 조회 · 조건 비교</text>
  <line x1="120" y1="882" x2="120" y2="942" stroke="#7d7d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <line x1="200" y1="944" x2="200" y2="886" stroke="#7d7d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <rect x="70" y="948" width="150" height="72" rx="36" fill="#faf9f7" stroke="#cfcdc8"/>
  <text x="145" y="994" text-anchor="middle" font-size="30" font-weight="700" fill="#222">사용자</text>
  <text x="240" y="978" font-size="26" fill="#444">interrupt</text>
  <text x="240" y="1010" font-size="21" fill="#444">빠진 값 1번 묻고 재개</text>

  <!-- RAG 에이전트 -->
  <rect x="530" y="470" width="500" height="610" rx="30" fill="#ffffff" stroke="#777"/>
  <text x="750" y="530" text-anchor="middle" font-size="30" font-weight="700" fill="#222">RAG 에이전트</text>
  <rect x="560" y="565" width="380" height="145" rx="18" fill="#f1efe9" stroke="#8a8780"/>
  <text x="750" y="618" text-anchor="middle" font-size="30" font-weight="700" fill="#222">검색</text>
  <text x="750" y="662" text-anchor="middle" font-size="23" fill="#555">코드 · 검색어 + 품번 필터</text>
  <line x1="750" y1="712" x2="750" y2="746" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="560" y="750" width="380" height="130" rx="18" fill="#eeecff" stroke="#5b4fcf"/>
  <text x="750" y="800" text-anchor="middle" font-size="30" font-weight="700" fill="#3b3496">근거 채점 + 답 쓰기</text>
  <text x="750" y="843" text-anchor="middle" font-size="24" fill="#4f46c8">LLM 1번</text>
  <line x1="750" y1="882" x2="750" y2="916" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="560" y="920" width="380" height="110" rx="18" fill="#f1efe9" stroke="#8a8780"/>
  <text x="750" y="967" text-anchor="middle" font-size="30" font-weight="700" fill="#222">인용 검사</text>
  <text x="750" y="1004" text-anchor="middle" font-size="23" fill="#555">코드</text>
  <text x="750" y="1064" text-anchor="middle" font-size="24" fill="#e0552d">↻ 근거 부족이면 재검색 1번</text>
  <path d="M941 815 H988 V637 H944" fill="none" stroke="#e0552d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ao)"/>

  <!-- 거절: 에이전트와 같은 줄 -->
  <rect x="1050" y="470" width="270" height="140" rx="24" fill="#f1efe9" stroke="#8a8780" stroke-dasharray="7 6"/>
  <text x="1185" y="526" text-anchor="middle" font-size="30" font-weight="700" fill="#222">거절 (끝)</text>
  <text x="1185" y="566" text-anchor="middle" font-size="20" fill="#555">범위 밖 · 실패 · 검사 걸림</text>
  <text x="1185" y="594" text-anchor="middle" font-size="20" fill="#555">코드</text>

  <!-- 범례 -->
  <rect x="40" y="1128" width="44" height="30" rx="8" fill="#eeecff" stroke="#5b4fcf"/>
  <text x="96" y="1152" font-size="26" fill="#444">LLM 단계</text>
  <rect x="226" y="1128" width="44" height="30" rx="8" fill="#f1efe9" stroke="#8a8780"/>
  <text x="282" y="1152" font-size="26" fill="#444">코드 단계</text>
  <line x1="410" y1="1143" x2="476" y2="1143" stroke="#7d7d7d" stroke-width="3"/>
  <text x="488" y="1152" font-size="26" fill="#444">항상 가는 길</text>
  <line x1="650" y1="1143" x2="716" y2="1143" stroke="#7d7d7d" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="728" y="1152" font-size="26" fill="#444">조건에 따라</text>
  <line x1="880" y1="1143" x2="946" y2="1143" stroke="#e0552d" stroke-width="3" stroke-dasharray="7 6"/>
  <text x="958" y="1152" font-size="26" fill="#444">다시 하기 (각 1번)</text>
