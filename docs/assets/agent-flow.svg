<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1180" width="1360" height="1180" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ag" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M2 1.5 L10 6 L2 10.5" fill="none" stroke="#7d7d7d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ao" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M2 1.5 L10 6 L2 10.5" fill="none" stroke="#e0552d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1360" height="1180" fill="#ffffff"/>

  <!-- 맨 윗줄 -->
  <rect x="40" y="40" width="180" height="70" rx="35" fill="#faf9f7" stroke="#cfcdc8"/>
  <text x="130" y="86" text-anchor="middle" font-size="30" font-weight="700" fill="#222">질문</text>
  <line x1="222" y1="75" x2="252" y2="75" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="262" y="22" width="300" height="106" rx="18" fill="#f1efe9" stroke="#8a8780"/>
  <text x="412" y="68" text-anchor="middle" font-size="30" font-weight="700" fill="#222">입력 준비</text>
  <text x="412" y="105" text-anchor="middle" font-size="22" fill="#555">읽기 · 기억 · 품번 확인</text>
  <line x1="412" y1="130" x2="412" y2="196" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="640" y="40" width="180" height="70" rx="35" fill="#faf9f7" stroke="#cfcdc8"/>
  <text x="730" y="86" text-anchor="middle" font-size="30" font-weight="700" fill="#222">답 (끝)</text>
  <line x1="730" y1="198" x2="730" y2="118" stroke="#7d7d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <text x="752" y="162" font-size="24" fill="#444">검사 통과 · 일상 대화 · 가격</text>

  <!-- Supervisor -->
  <rect x="40" y="200" width="1280" height="160" rx="22" fill="#eeecff" stroke="#5b4fcf"/>
  <text x="680" y="250" text-anchor="middle" font-size="32" font-weight="700" fill="#3b3496">Supervisor</text>
  <text x="680" y="293" text-anchor="middle" font-size="24" fill="#4f46c8">계획 LLM 1회 + 코드 규칙</text>
  <text x="680" y="332" text-anchor="middle" font-size="24" fill="#4f46c8">답 모으기 · 답 검사 · 거절은 코드 · 답이 섞일 때만 종합 LLM 1회</text>

  <!-- Supervisor ↔ 에이전트 화살표 -->
  <line x1="95" y1="362" x2="95" y2="466" stroke="#7d7d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <text x="112" y="425" font-size="22" fill="#444">지시서</text>
  <line x1="215" y1="468" x2="215" y2="364" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="230" y="425" font-size="22" fill="#444">보고</text>
  <text x="520" y="415" text-anchor="middle" font-size="24" fill="#444">두 에이전트에 동시에 보냄</text>
  <text x="520" y="455" text-anchor="middle" font-size="24" fill="#e0552d">↻ 실패 보고면 재지시 최대 1번</text>
  <line x1="790" y1="468" x2="790" y2="364" stroke="#7d7d7d" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="776" y="425" text-anchor="end" font-size="22" fill="#444">보고</text>
  <line x1="925" y1="362" x2="925" y2="466" stroke="#7d7d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ag)"/>
  <text x="942" y="425" font-size="22" fill="#444">지시서</text>
  <line x1="1185" y1="362" x2="1185" y2="466" stroke="#7d7d7d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ag)"/>

  <!-- Spec 에이전트 -->
  <rect x="40" y="470" width="470" height="610" rx="30" fill="#ffffff" stroke="#777"/>
  <text x="275" y="530" text-anchor="middle" font-size="30" font-weight="700" fill="#222">Spec 에이전트</text>
  <rect x="70" y="565" width="410" height="145" rx="18" fill="#eeecff" stroke="#5b4fcf"/>
  <text x="275" y="610" text-anchor="middle" font-size="30" font-weight="700" fill="#3b3496">회로 역할 읽기</text>
  <text x="275" y="652" text-anchor="middle" font-size="23" fill="#4f46c8">LLM · 같은 읽기 3회 동시</text>
